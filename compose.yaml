
services:
  redis:
    image: 'redislabs/redismod'
    ports:
      - '6379:6379'
  web1:
    build: ./web
    hostname: web1
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    ports:
      - "81:5000"
  web2:
    build: ./web
    hostname: web2
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    ports:
      - "82:5000"
  nginx:
    build: ./nginx
    ports:
    - '80:80'
    depends_on:
    - web1
    - web2


